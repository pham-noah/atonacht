[package]
name = "atonacht"
version = "0.1.5"
description = "Daily notes and to-dos as plain Markdown files"
edition = "2021"

[lib]
name = "atonacht_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-android-fs = "=30.2.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
notify = "8"
# Syncthing status is read straight from Rust: no plugin scope, no browser CORS, works the same on Android.
base64 = "0.22"
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# Release builds ship inside an APK: symbols and unused code are weight the phone pays for. LTO plus stripping takes a
# large slice off libatonacht_lib.so, which is most of the install.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
