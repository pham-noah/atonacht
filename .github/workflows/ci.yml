name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes another cancels the older run: the answer for the old commit is no longer wanted,
# and the runner minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Types, tests and web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  rust:
    name: Rust file layer and Tauri shell
    runs-on: ubuntu-24.04
    # A stalled apt mirror must fail the job, not occupy a runner for the default six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # `apt-get update` has stalled for twenty minutes on this runner twice in one afternoon: bound the
      # fetch, retry it, and skip the recommends this build never compiles against.
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - run: npm run build # the Tauri build script needs ../dist
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
