name: Release

# Push a tag like v0.2.0 to build installers for Windows, macOS and Linux, plus a signed Android APK.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # lets the Android/desktop jobs be re-run on an existing tag

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, args: "" }
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system libraries (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - name: Read the version
        id: ver
        # On windows-latest this step otherwise runs under pwsh, where the nested quotes break and the tag comes out
        # empty - tauri-action then skips every upload without failing.
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Atonacht ${{ steps.ver.outputs.tag }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK, build tools and platform
        run: |
          # The setup-android action calls `sdkmanager tools`, a package that was removed; use the SDK's own manager.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || SDK="$(dirname "$(dirname "$(find / -name sdkmanager -type f 2>/dev/null | head -n1)")")"
          SDKMAN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || SDKMAN="$(find "$SDK" -name sdkmanager -type f | head -n1)"
          # Tauri's CLI insists on a valid NDK_HOME, so publish both paths for the steps that follow.
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          yes | "$SDKMAN" --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - name: Read the version
        id: ver
        # On windows-latest this step otherwise runs under pwsh, where the nested quotes break and the tag comes out
        # empty - tauri-action then skips every upload without failing.
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the Android project and add the widget, share receiver and permissions
        run: npm run android:setup
      - name: Build an unsigned APK
        run: npx tauri android build --apk
      - name: Align and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n1)
          test -n "$UNSIGNED" || { echo "No unsigned APK found"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out "Atonacht-${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "Atonacht-${VERSION}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Atonacht ${{ steps.ver.outputs.tag }}
          draft: true
          files: Atonacht-*.apk
