name: Release

# Push a tag like v0.2.0 to build installers for Windows, macOS and Linux, plus a signed Android APK.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # lets the Android/desktop jobs be re-run on an existing tag

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, args: "" }
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system libraries (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Atonacht ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK, build tools and platform
        run: |
          # The setup-android action calls `sdkmanager tools`, a package that was removed; use the SDK's own manager.
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMAN" ] || SDKMAN="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n1)"
          yes | "$SDKMAN" --install "ndk;27.0.12077973" "build-tools;35.0.0" "platforms;android-35" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      - name: Create the Android project and add the widget, share receiver and permissions
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run android:setup
      - name: Build an unsigned APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --apk
      - name: Align and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n1)
          test -n "$UNSIGNED" || { echo "No unsigned APK found"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out "Atonacht-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "Atonacht-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Atonacht-*.apk
